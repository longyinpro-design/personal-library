name: Release

on:
  push:
    tags:
      - "v*"
  # 允许对已有标签重新构建并覆盖发布（例如修复打包脚本后补发同一版本）。
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新构建并发布的已有标签，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build DMG and publish release
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Optional signing material. Empty secrets keep the ad-hoc build path.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # generate-notes 需要标签之间的历史才能列出变更。
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) version="${TAG#v}" ;;
            *)
              echo "release tags must start with 'v' (got '$TAG')" >&2
              exit 1
              ;;
          esac
          if ! commit="$(git rev-parse --verify "$TAG^{commit}" 2>/dev/null)"; then
            echo "tag not found: $TAG (先 git push origin $TAG)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Building 个人资料库 v$version at $commit"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Runs only when the repository has a Developer ID certificate. The
      # temporary keychain is deleted at the end of the job either way.
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          cert="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k actions "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Build app bundle
        env:
          PERSONAL_LIBRARY_VERSION: ${{ steps.version.outputs.version }}
        run: ./script/build_and_run.sh --build

      - name: Package DMG and checksum
        env:
          PERSONAL_LIBRARY_VERSION: ${{ steps.version.outputs.version }}
          PERSONAL_LIBRARY_SIGN_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY }}
          PERSONAL_LIBRARY_NOTARY_APPLE_ID: ${{ env.NOTARY_APPLE_ID }}
          PERSONAL_LIBRARY_NOTARY_TEAM_ID: ${{ env.NOTARY_TEAM_ID }}
          PERSONAL_LIBRARY_NOTARY_PASSWORD: ${{ env.NOTARY_PASSWORD }}
        run: ./script/package_dmg.sh --skip-build

      - name: Verify checksums before upload
        run: |
          set -euo pipefail
          ls -l dist
          ( cd dist && /usr/bin/shasum -a 256 -c ./*.sha256 )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PersonalLibrary-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          commit="${{ steps.version.outputs.commit }}"
          notes="$(mktemp)"
          cat .github/release-header.md > "$notes"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$commit" \
              --jq .body >> "$notes"; then
            printf '\n**完整变更**：https://github.com/%s/commits/%s\n' \
              "$GITHUB_REPOSITORY" "$TAG" >> "$notes"
          fi

          assets=(dist/*.dmg dist/*.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" \
              --title "个人资料库 v$version" \
              --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "个人资料库 v$version" \
              --notes-file "$notes"
          fi

      - name: Verify published assets
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh release download "$TAG" --dir "$work" --clobber
          ls -l "$work"
          ( cd "$work" && /usr/bin/shasum -a 256 -c ./*.sha256 )
          expected="$(awk '{print $1}' dist/*.sha256)"
          actual="$(awk '{print $1}' "$work"/*.sha256)"
          if [[ "$expected" != "$actual" ]]; then
            echo "published checksum differs from the built DMG" >&2
            exit 1
          fi

      - name: Remove signing keychain
        if: always() && env.MACOS_CERTIFICATE_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Write job summary
        run: |
          {
            echo "### 个人资料库 v${{ steps.version.outputs.version }}"
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
