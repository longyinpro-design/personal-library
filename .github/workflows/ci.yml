name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: ./script/build_and_run.sh --test

      - name: Build app bundle
        run: ./script/build_and_run.sh --build

      - name: Verify app bundle
        run: |
          APP=".build/app/个人资料库.app"
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist"

      # 打包只在本地或 Release 里跑到过，这里提前暴露 hdiutil/签名问题。
      - name: Package DMG
        run: ./script/package_dmg.sh --skip-build

      - name: Verify DMG and checksum
        run: |
          set -euo pipefail
          ls -l dist
          /usr/bin/hdiutil verify dist/*.dmg
          ( cd dist && /usr/bin/shasum -a 256 -c ./*.sha256 )
